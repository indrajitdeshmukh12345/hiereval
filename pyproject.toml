[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hiereval"
version = "0.1.0"
description = "Structure-aware and confidence-aware evaluation metrics for hierarchical classification"
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
authors = [{ name = "Indrajit Deshmukh" }]
keywords = [
    "machine-learning", "metrics", "evaluation",
    "hierarchical-classification", "taxonomy", "calibration",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov", "ruff", "mypy"]

[project.urls]
Homepage = "https://github.com/indrajitdeshmukh12345/hiereval"
Issues = "https://github.com/indrajitdeshmukh12345/hiereval/issues"

[tool.ruff]
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
files = ["src"]

[tool.pytest.ini_options]
addopts = "--cov=hiereval --cov-report=term-missing -q"
testpaths = ["tests"]
